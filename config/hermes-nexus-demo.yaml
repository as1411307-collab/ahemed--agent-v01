# NEXUS sandbox template, NOT installed automatically by this PR.
# To use in an isolated Hermes profile, install nexus-proposal-guard plugin
# and verify the effective exposed tools before enabling any live run.
# This file deliberately contains NO API keys, endpoint credentials or tunnels.
plugins:
  enabled:
    - nexus-proposal-guard

# Tool Search can defer/unwrap tools, changing which pre-tool hook runs.
# NEXUS uses a small explicit tool surface, so turn this off.
tools:
  tool_search:
    enabled: off

# Explicit minimal API-server toolsets, including readable web extraction.
# DO NOT add hermes-api-server/hermes-cli/coding as disabled composite
# entries: Hermes subtracts their overlapping core tools from the allowlist.
platform_toolsets:
  api_server:
    - web
    - memory
    - nexus-proposal

# Defense in depth: prevent delegation, code/OS/browser and filesystem tools.
# The plugin checks the loaded config and resolved effective names on every hook.
# This is not a substitute for OS/container permission isolation.
agent:
  disabled_toolsets:
    - delegation
    - code_execution
    - terminal
    - file
    - browser
    - cronjob
    - computer_use
