name: Install design skills

# Installs the design / motion / 3D / graph / voice skills listed in
# scripts/install-design-skills.sh into .claude/skills on GitHub's runners and
# commits the result to the branch the workflow was run on. Run it from the
# Actions tab ("Run workflow") on any branch; it also runs when the installer
# script changes on the design-skills branch.
on:
  workflow_dispatch:
  push:
    branches: [feat/design-skills-2026-10-20]
    paths:
      - scripts/install-design-skills.sh

permissions:
  contents: write

concurrency:
  group: install-design-skills-${{ github.ref }}
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install skills with the official skills CLI
        run: bash scripts/install-design-skills.sh

      - name: Commit installed skills to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .claude skills-lock.json 2>/dev/null || true
          [ -d .agents ] && git add -A .agents || true
          [ -d .impeccable ] && git add -A .impeccable || true
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
          else
            git commit -m "Install design skills via GitHub Actions" -m "Installed by .github/workflows/install-design-skills.yml from scripts/install-design-skills.sh (sources listed in docs/SKILLS.md)."
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Summary
        run: |
          echo "## Skills now in .claude/skills" >> "$GITHUB_STEP_SUMMARY"
          ls -1 .claude/skills | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY"
