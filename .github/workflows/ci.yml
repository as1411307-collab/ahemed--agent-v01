name: CI

# Runs the Core test suite and the type checks on every push and pull request.
# Keep this green: a red main is how 30 integration tests went missing on 2026-10-21.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run typecheck -w @ahmed/mobile

  xcode-simulator-compile:
    # Experimental branch only. This is unsigned simulator compilation, NOT
    # Apple Developer provisioning or real Secure Enclave phone verification.
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'security/iphone-signed-approval-trial-2026-11-03' }}
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      EXPO_PUBLIC_CORE_URL: https://core.example.invalid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate native iOS project for Xcode
        working-directory: apps/mobile
        run: npx expo prebuild --platform ios --no-install
      - name: Verify existing Secure Enclave module is autolinked
        working-directory: apps/mobile
        run: |
          npx expo-modules-autolinking resolve --platform apple > /tmp/expo-autolink-trial.json
          grep -F 'EnclaveSignerModule' /tmp/expo-autolink-trial.json
      - name: Resolve CocoaPods
        working-directory: apps/mobile/ios
        run: pod install
      - name: Compile Xcode simulator target without signing
        working-directory: apps/mobile/ios
        shell: bash
        run: |
          set -euo pipefail
          workspace="$(find . -maxdepth 1 -name '*.xcworkspace' -print -quit)"
          test -n "$workspace"
          scheme="$(xcodebuild -list -json -workspace "$workspace" | node -e 'let s="";process.stdin.on("data",c=>s+=c);process.stdin.on("end",()=>{const schemes=JSON.parse(s).workspace.schemes; if(!schemes?.length) process.exit(2); console.log(schemes.find(n=>!/Pods/i.test(n))||schemes[0])})')"
          xcodebuild -workspace "$workspace" -scheme "$scheme" \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build

