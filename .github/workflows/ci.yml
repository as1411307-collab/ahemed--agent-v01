name: CI

# Runs the Core test suite and the type checks on every push and pull request.
# Keep this green: a red main is how 30 integration tests went missing on 2026-10-21.
on:
  push:
    branches: [main]
  pull_request:

# Superseded draft commits should not backlog expensive macOS simulator jobs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
      - name: Fail on high/critical advisories
        run: npm audit --audit-level=high

  hermes-runtime-guard:
    # Standalone Python validation: no Hermes API keys or native actions.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install YAML parser for exact checked-in Hermes profile
        run: python -m pip install --disable-pip-version-check PyYAML
      - name: Assert Hermes guard fails closed under config and tool drift
        run: python -m unittest discover -s scripts -p 'test_hermes_runtime_guard.py' -v
