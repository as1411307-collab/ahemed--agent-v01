<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXUS - Ultimate Command Interface</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap');
  
  body {
    font-family: 'Rajdhani', sans-serif;
    background: #000;
    color: #fff;
    overflow: hidden;
    height: 100vh;
    width: 100vw;
    user-select: none;
  }

  /* ============ INTRO ============ */
  #intro-screen {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: linear-gradient(135deg, #0a0015 0%, #1a0533 50%, #000 100%);
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    transition: opacity 2s ease;
  }

  #intro-screen.fade-out { opacity: 0; pointer-events: none; }

  .intro-title {
    font-family: 'Orbitron', sans-serif;
    font-size: 72px;
    font-weight: 900;
    background: linear-gradient(135deg, #00d4ff, #7b2cbf, #ff006e);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: titleGlow 3s ease-in-out infinite;
    letter-spacing: 10px;
    margin-bottom: 30px;
  }

  @keyframes titleGlow {
    0%, 100% { filter: drop-shadow(0 0 20px rgba(0, 212, 255, 0.5)); }
    50% { filter: drop-shadow(0 0 40px rgba(123, 44, 191, 0.8)); }
  }

  .start-btn {
    padding: 20px 60px;
    font-family: 'Orbitron', sans-serif;
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 4px;
    background: linear-gradient(135deg, rgba(0, 212, 255, 0.2), rgba(123, 44, 191, 0.2));
    border: 2px solid #00d4ff;
    color: #fff;
    cursor: pointer;
    transition: all 0.3s ease;
    text-transform: uppercase;
  }

  .start-btn:hover {
    background: linear-gradient(135deg, rgba(0, 212, 255, 0.4), rgba(123, 44, 191, 0.4));
    box-shadow: 0 0 40px rgba(0, 212, 255, 0.6);
    transform: scale(1.05);
  }

  /* ============ GAME CONTAINER ============ */
  #game-container {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    opacity: 0;
    pointer-events: none;
    transition: opacity 2s ease;
  }

  #game-container.active { opacity: 1; pointer-events: all; }

  #bg-canvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 1;
  }

  /* ============ TOOLBAR ============ */
  .toolbar {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(10, 0, 21, 0.95);
    backdrop-filter: blur(30px);
    border: 1px solid rgba(0, 212, 255, 0.4);
    border-radius: 50px;
    padding: 12px 30px;
    z-index: 200;
    display: flex;
    gap: 15px;
    box-shadow: 0 0 40px rgba(0, 212, 255, 0.2);
  }

  .tool-btn {
    background: rgba(0, 212, 255, 0.1);
    border: 1px solid rgba(0, 212, 255, 0.3);
    border-radius: 25px;
    padding: 10px 20px;
    color: #00d4ff;
    font-family: 'Orbitron', sans-serif;
    font-size: 11px;
    letter-spacing: 2px;
    cursor: pointer;
    transition: all 0.3s ease;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .tool-btn:hover {
    background: rgba(0, 212, 255, 0.3);
    border-color: #00d4ff;
    box-shadow: 0 0 20px rgba(0, 212, 255, 0.4);
    transform: translateY(-2px);
  }

  .tool-btn.active {
    background: linear-gradient(135deg, #00d4ff, #7b2cbf);
    color: #fff;
    border-color: #fff;
  }

  /* ============ WORKFLOW BUILDER (n8n Style) ============ */
  .workflow-panel {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(5, 0, 15, 0.98);
    backdrop-filter: blur(40px);
    z-index: 300;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.5s ease;
  }

  .workflow-panel.open {
    opacity: 1;
    pointer-events: all;
  }

  .workflow-header {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 70px;
    background: rgba(10, 0, 21, 0.95);
    border-bottom: 1px solid rgba(0, 212, 255, 0.3);
    padding: 0 30px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 310;
  }

  .workflow-title {
    font-family: 'Orbitron', sans-serif;
    font-size: 20px;
    color: #00d4ff;
    letter-spacing: 3px;
  }

  .workflow-actions {
    display: flex;
    gap: 15px;
  }

  .workflow-canvas {
    position: absolute;
    top: 70px;
    left: 0;
    right: 0;
    bottom: 0;
    background: radial-gradient(ellipse at center, #0a0015 0%, #000 100%);
    overflow: hidden;
  }

  .workflow-node {
    position: absolute;
    width: 200px;
    background: rgba(10, 0, 21, 0.95);
    border: 2px solid rgba(0, 212, 255, 0.4);
    border-radius: 12px;
    padding: 15px;
    cursor: move;
    z-index: 320;
    box-shadow: 0 0 30px rgba(0, 212, 255, 0.2);
    transition: all 0.3s ease;
  }

  .workflow-node:hover {
    border-color: #00d4ff;
    box-shadow: 0 0 40px rgba(0, 212, 255, 0.4);
    transform: scale(1.02);
  }

  .workflow-node.active {
    border-color: #00ff88;
    box-shadow: 0 0 50px rgba(0, 255, 136, 0.4);
  }

  .node-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
    padding-bottom: 10px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
  }

  .node-icon {
    width: 35px;
    height: 35px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
  }

  .node-title {
    font-family: 'Orbitron', sans-serif;
    font-size: 13px;
    color: #fff;
    letter-spacing: 1px;
  }

  .node-content {
    font-size: 12px;
    color: rgba(255, 255, 255, 0.7);
    line-height: 1.6;
  }

  .node-ports {
    display: flex;
    justify-content: space-between;
    margin-top: 15px;
  }

  .node-port {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #00d4ff;
    border: 2px solid #fff;
    cursor: crosshair;
    transition: all 0.3s ease;
  }

  .node-port:hover {
    transform: scale(1.5);
    box-shadow: 0 0 15px #00d4ff;
  }

  .node-port.input { background: #ff006e; }
  .node-port.output { background: #00ff88; }

  .workflow-connections {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 315;
  }

  .connection-line {
    stroke: #00d4ff;
    stroke-width: 2;
    fill: none;
    filter: drop-shadow(0 0 5px #00d4ff);
  }

  /* ============ FILE UPLOAD ============ */
  .file-upload-zone {
    position: fixed;
    bottom: 300px;
    right: 30px;
    width: 300px;
    background: rgba(10, 0, 21, 0.95);
    backdrop-filter: blur(30px);
    border: 2px dashed rgba(0, 212, 255, 0.4);
    border-radius: 15px;
    padding: 30px;
    z-index: 200;
    text-align: center;
    transition: all 0.3s ease;
    cursor: pointer;
  }

  .file-upload-zone:hover {
    border-color: #00d4ff;
    border-style: solid;
    box-shadow: 0 0 30px rgba(0, 212, 255, 0.3);
    transform: translateY(-5px);
  }

  .file-upload-zone.dragover {
    border-color: #00ff88;
    background: rgba(0, 255, 136, 0.1);
  }

  .upload-icon {
    font-size: 48px;
    margin-bottom: 15px;
    color: #00d4ff;
  }

  .upload-text {
    font-size: 14px;
    color: rgba(255, 255, 255, 0.8);
    margin-bottom: 10px;
  }

  .upload-hint {
    font-size: 11px;
    color: rgba(255, 255, 255, 0.5);
  }

  .file-list {
    margin-top: 20px;
    max-height: 200px;
    overflow-y: auto;
  }

  .file-item {
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 8px;
    padding: 12px;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 12px;
  }

  .file-icon {
    font-size: 24px;
  }

  .file-info {
    flex: 1;
    text-align: right;
  }

  .file-name {
    color: #fff;
    margin-bottom: 3px;
  }

  .file-size {
    color: rgba(255, 255, 255, 0.5);
    font-size: 10px;
  }

  .file-delete {
    background: rgba(255, 0, 0, 0.2);
    border: 1px solid rgba(255, 0, 0, 0.4);
    color: #ff4444;
    width: 25px;
    height: 25px;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s ease;
  }

  .file-delete:hover {
    background: rgba(255, 0, 0, 0.4);
    transform: scale(1.1);
  }

  /* ============ INTEGRATION PANEL ============ */
  .integration-panel {
    position: fixed;
    top: 0;
    left: -500px;
    width: 500px;
    height: 100%;
    background: rgba(10, 0, 21, 0.98);
    backdrop-filter: blur(40px);
    border-right: 2px solid rgba(0, 255, 136, 0.4);
    padding: 40px;
    z-index: 250;
    transition: left 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    overflow-y: auto;
  }

  .integration-panel.open { left: 0; }

  .integration-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 40px;
    padding-bottom: 25px;
    border-bottom: 2px solid rgba(0, 255, 136, 0.2);
  }

  .integration-title {
    font-family: 'Orbitron', sans-serif;
    font-size: 24px;
    color: #00ff88;
    letter-spacing: 3px;
  }

  .integration-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
    margin-bottom: 30px;
  }

  .integration-card {
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 12px;
    padding: 20px;
    text-align: center;
    cursor: pointer;
    transition: all 0.3s ease;
  }

  .integration-card:hover {
    background: rgba(0, 255, 136, 0.1);
    border-color: #00ff88;
    transform: translateY(-5px);
    box-shadow: 0 10px 30px rgba(0, 255, 136, 0.2);
  }

  .integration-card.connected {
    background: rgba(0, 255, 136, 0.2);
    border-color: #00ff88;
  }

  .integration-icon {
    font-size: 36px;
    margin-bottom: 10px;
  }

  .integration-name {
    font-family: 'Orbitron', sans-serif;
    font-size: 12px;
    color: #fff;
    letter-spacing: 1px;
    margin-bottom: 5px;
  }

  .integration-status {
    font-size: 10px;
    color: rgba(255, 255, 255, 0.6);
  }

  .integration-card.connected .integration-status {
    color: #00ff88;
  }

  /* ============ CORE & AGENTS ============ */
  .core-container {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 250px;
    height: 250px;
    z-index: 50;
    cursor: pointer;
  }

  .core-orb-wrapper { position: relative; width: 100%; height: 100%; }

  .core-orb {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 120px; height: 120px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #fff 0%, #00d4ff 20%, #7b2cbf 60%, #000 100%);
    box-shadow: 
      0 0 60px #00d4ff,
      0 0 120px #7b2cbf,
      0 0 180px rgba(123, 44, 191, 0.5),
      inset 0 0 40px rgba(255, 255, 255, 0.8);
    animation: corePulse 3s ease-in-out infinite;
  }

  .core-ring {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    border: 2px solid;
    animation: ringRotate linear infinite;
  }

  .core-ring-1 { width: 160px; height: 160px; border-color: rgba(0, 212, 255, 0.6); animation-duration: 8s; }
  .core-ring-2 { width: 200px; height: 200px; border-color: rgba(123, 44, 191, 0.4); animation-duration: 12s; animation-direction: reverse; }
  .core-ring-3 { width: 240px; height: 240px; border-color: rgba(255, 0, 110, 0.3); animation-duration: 16s; }

  @keyframes corePulse {
    0%, 100% { transform: translate(-50%, -50%) scale(1); }
    50% { transform: translate(-50%, -50%) scale(1.15); }
  }

  @keyframes ringRotate {
    0% { transform: translate(-50%, -50%) rotate(0deg); }
    100% { transform: translate(-50%, -50%) rotate(360deg); }
  }

  .core-label {
    position: absolute;
    bottom: -50px;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'Orbitron', sans-serif;
    font-size: 16px;
    letter-spacing: 4px;
    color: #00d4ff;
    text-shadow: 0 0 20px #00d4ff;
    white-space: nowrap;
  }

  .sub-agent {
    position: absolute;
    width: 70px; height: 70px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(0, 212, 255, 0.2), rgba(123, 44, 191, 0.2));
    border: 2px solid;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 50;
    backdrop-filter: blur(10px);
  }

  .sub-agent:hover { transform: scale(1.4); z-index: 60; }
  .sub-agent-icon { font-size: 28px; filter: drop-shadow(0 0 10px currentColor); }
  .sub-agent-label {
    position: absolute;
    bottom: -30px;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'Orbitron', sans-serif;
    font-size: 10px;
    letter-spacing: 2px;
    color: rgba(255, 255, 255, 0.9);
    white-space: nowrap;
  }

  #connectors-svg {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 40;
    pointer-events: none;
  }

  .connector-line {
    stroke-width: 2;
    fill: none;
    stroke-dasharray: 8, 4;
    animation: dashFlow 1.5s linear infinite;
    opacity: 0.6;
  }

  @keyframes dashFlow { to { stroke-dashoffset: -24; } }

  /* ============ CHAT ============ */
  .chat-container {
    position: fixed;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    width: 700px;
    max-width: 90%;
    background: rgba(10, 0, 21, 0.9);
    backdrop-filter: blur(30px);
    border: 1px solid rgba(0, 212, 255, 0.4);
    border-radius: 15px;
    padding: 25px;
    z-index: 100;
    box-shadow: 0 0 40px rgba(0, 212, 255, 0.2);
  }

  .chat-messages {
    height: 200px;
    overflow-y: auto;
    margin-bottom: 20px;
    padding: 15px;
    background: rgba(0, 0, 0, 0.3);
    border-radius: 10px;
  }

  .chat-message {
    margin-bottom: 15px;
    padding: 15px 20px;
    border-radius: 12px;
    max-width: 85%;
    animation: messageSlide 0.4s ease;
    font-size: 14px;
    line-height: 1.6;
  }

  .chat-message.user {
    background: linear-gradient(135deg, rgba(0, 212, 255, 0.2), rgba(0, 212, 255, 0.1));
    border: 1px solid rgba(0, 212, 255, 0.4);
    margin-left: auto;
    text-align: right;
  }

  .chat-message.agent {
    background: linear-gradient(135deg, rgba(123, 44, 191, 0.2), rgba(123, 44, 191, 0.1));
    border: 1px solid rgba(123, 44, 191, 0.4);
  }

  .chat-message img {
    max-width: 100%;
    border-radius: 10px;
    margin-top: 10px;
  }

  @keyframes messageSlide {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .chat-input-container { display: flex; gap: 15px; }

  .chat-input {
    flex: 1;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(0, 212, 255, 0.3);
    border-radius: 25px;
    padding: 15px 25px;
    color: #fff;
    font-size: 15px;
    font-family: 'Rajdhani', sans-serif;
    outline: none;
  }

  .chat-input:focus {
    border-color: #00d4ff;
    box-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
  }

  .chat-send {
    background: linear-gradient(135deg, #00d4ff, #7b2cbf);
    border: none;
    border-radius: 50%;
    width: 50px; height: 50px;
    cursor: pointer;
    color: #fff;
    font-size: 20px;
    transition: all 0.3s ease;
  }

  .chat-send:hover {
    transform: scale(1.1) rotate(10deg);
    box-shadow: 0 0 30px rgba(0, 212, 255, 0.6);
  }

  /* ============ SETTINGS ============ */
  .settings-panel {
    position: fixed;
    top: 0; right: -500px;
    width: 500px; height: 100%;
    background: rgba(10, 0, 21, 0.98);
    backdrop-filter: blur(40px);
    border-left: 2px solid rgba(0, 212, 255, 0.4);
    padding: 40px;
    z-index: 250;
    transition: right 0.6s ease;
    overflow-y: auto;
  }

  .settings-panel.open { right: 0; }

  .settings-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 40px;
    padding-bottom: 25px;
    border-bottom: 2px solid rgba(0, 212, 255, 0.2);
  }

  .settings-title {
    font-family: 'Orbitron', sans-serif;
    font-size: 24px;
    color: #00d4ff;
    letter-spacing: 3px;
  }

  .settings-close {
    background: rgba(255, 255, 255, 0.1);
    border: 1px solid rgba(255, 255, 255, 0.3);
    color: #fff;
    width: 40px; height: 40px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 20px;
    transition: all 0.3s ease;
  }

  .settings-close:hover {
    background: rgba(255, 0, 0, 0.3);
    border-color: #ff4444;
    transform: rotate(90deg);
  }

  .setting-group { margin-bottom: 25px; }

  .setting-label {
    display: block;
    margin-bottom: 10px;
    color: rgba(255, 255, 255, 0.7);
    font-size: 12px;
    letter-spacing: 2px;
    font-family: 'Orbitron', sans-serif;
  }

  .setting-input, .setting-select {
    width: 100%;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(0, 212, 255, 0.3);
    border-radius: 8px;
    padding: 12px;
    color: #fff;
    font-size: 14px;
    font-family: 'Rajdhani', sans-serif;
    outline: none;
  }

  .setting-input:focus, .setting-select:focus {
    border-color: #00d4ff;
    box-shadow: 0 0 15px rgba(0, 212, 255, 0.2);
  }

  .setting-select option { background: #0a0015; }

  /* ============ SCROLLBAR ============ */
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.3); }
  ::-webkit-scrollbar-thumb { 
    background: linear-gradient(180deg, #00d4ff, #7b2cbf);
    border-radius: 4px;
  }
</style>
</head>
<body>

<!-- INTRO -->
<div id="intro-screen">
  <div class="intro-title">NEXUS</div>
  <button class="start-btn" onclick="startGame()">INITIALIZE SYSTEM</button>
</div>

<!-- GAME -->
<div id="game-container">
  <canvas id="bg-canvas"></canvas>
  <svg id="connectors-svg"></svg>
  
  <!-- TOOLBAR -->
  <div class="toolbar">
    <button class="tool-btn" onclick="toggleWorkflow()"> WORKFLOW</button>
    <button class="tool-btn" onclick="toggleIntegration()"> INTEGRATIONS</button>
    <button class="tool-btn" onclick="toggleSettings()">️ SETTINGS</button>
  </div>

  <!-- CORE -->
  <div class="core-container" onclick="openSettings()">
    <div class="core-orb-wrapper">
      <div class="core-orb"></div>
      <div class="core-ring core-ring-1"></div>
      <div class="core-ring core-ring-2"></div>
      <div class="core-ring core-ring-3"></div>
    </div>
    <div class="core-label">NEXUS CORE</div>
  </div>

  <div id="sub-agents-container"></div>

  <!-- FILE UPLOAD -->
  <div class="file-upload-zone" id="fileUploadZone" onclick="document.getElementById('fileInput').click()">
    <div class="upload-icon">📁</div>
    <div class="upload-text">Drop files here or click to upload</div>
    <div class="upload-hint">Supports: PDF, TXT, JSON, CSV, Images</div>
    <div class="file-list" id="fileList"></div>
    <input type="file" id="fileInput" multiple style="display: none" onchange="handleFiles(this.files)">
  </div>

  <!-- CHAT -->
  <div class="chat-container">
    <div class="chat-messages" id="chatMessages"></div>
    <div class="chat-input-container">
      <input type="text" class="chat-input" id="chatInput" placeholder="Communicate with NEXUS..." onkeypress="handleChatKey(event)">
      <button class="chat-send" onclick="sendMessage()">➤</button>
    </div>
  </div>
</div>

<!-- WORKFLOW PANEL -->
<div class="workflow-panel" id="workflowPanel">
  <div class="workflow-header">
    <div class="workflow-title">🔧 WORKFLOW BUILDER</div>
    <div class="workflow-actions">
      <button class="tool-btn" onclick="addNode('trigger')">+ TRIGGER</button>
      <button class="tool-btn" onclick="addNode('action')">+ ACTION</button>
      <button class="tool-btn" onclick="addNode('llm')">+ LLM</button>
      <button class="tool-btn" onclick="runWorkflow()">▶️ RUN</button>
      <button class="tool-btn" onclick="toggleWorkflow()">✕ CLOSE</button>
    </div>
  </div>
  <div class="workflow-canvas" id="workflowCanvas">
    <svg class="workflow-connections" id="workflowConnections"></svg>
  </div>
</div>

<!-- INTEGRATION PANEL -->
<div class="integration-panel" id="integrationPanel">
  <div class="integration-header">
    <div class="integration-title"> INTEGRATIONS</div>
    <button class="settings-close" onclick="toggleIntegration()">✕</button>
  </div>
  <div class="integration-grid" id="integrationGrid">
    <!-- Integrations will be added here -->
  </div>
</div>

<!-- SETTINGS -->
<div class="settings-panel" id="settingsPanel">
  <div class="settings-header">
    <div class="settings-title">⚙️ SETTINGS</div>
    <button class="settings-close" onclick="toggleSettings()">✕</button>
  </div>
  
  <div class="setting-group">
    <label class="setting-label">OPENAI API KEY</label>
    <input type="password" class="setting-input" id="apiKey" placeholder="sk-...">
  </div>

  <div class="setting-group">
    <label class="setting-label">AI MODEL</label>
    <select class="setting-select" id="aiModel">
      <option value="gpt-4">GPT-4</option>
      <option value="gpt-4-turbo">GPT-4 Turbo</option>
      <option value="gpt-3.5-turbo">GPT-3.5 Turbo</option>
    </select>
  </div>

  <div class="setting-group">
    <label class="setting-label">AGENT NAME</label>
    <input type="text" class="setting-input" value="NEXUS" id="agentName">
  </div>

  <div class="setting-group">
    <label class="setting-label">SYSTEM PROMPT</label>
    <input type="text" class="setting-input" value="You are NEXUS, an advanced AI assistant" id="systemPrompt">
  </div>
</div>

<script>
// ============ AUDIO ============
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function playTone(freq, duration, type = 'sine', volume = 0.1) {
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(volume, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + duration);
}

function playClick() { playTone(800, 0.08, 'square', 0.05); }
function playSuccess() { 
  playTone(523, 0.1); setTimeout(() => playTone(659, 0.1), 100);
  setTimeout(() => playTone(784, 0.15), 200);
}

// ============ GAME START ============
function startGame() {
  playSuccess();
  document.getElementById('intro-screen').classList.add('fade-out');
  setTimeout(() => {
    document.getElementById('game-container').classList.add('active');
    initBackground();
    initSubAgents();
    initConnectors();
    initIntegrations();
    initFileUpload();
    addAgentMessage("Welcome, Captain. NEXUS systems initialized. All modules online.");
  }, 2000);
}

// ============ BACKGROUND ============
const canvas = document.getElementById('bg-canvas');
const ctx = canvas.getContext('2d');
let stars = [];

function initBackground() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  for (let i = 0; i < 300; i++) {
    stars.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      size: Math.random() * 2,
      alpha: Math.random(),
      speed: Math.random() * 0.5 + 0.1
    });
  }
  animateBackground();
}

function animateBackground() {
  ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  stars.forEach(s => {
    s.alpha += (Math.random() - 0.5) * 0.05;
    s.alpha = Math.max(0.1, Math.min(1, s.alpha));
    s.y += s.speed;
    if (s.y > canvas.height) s.y = 0;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255, 255, 255, ${s.alpha})`;
    ctx.fill();
  });
  requestAnimationFrame(animateBackground);
}

// ============ SUB-AGENTS ============
const subAgents = [
  { name: 'Navigation', icon: '', color: '#00d4ff' },
  { name: 'Security', icon: '🛡️', color: '#ff4444' },
  { name: 'Engineering', icon: '⚙️', color: '#ffaa00' },
  { name: 'Research', icon: '🔬', color: '#00ff88' },
  { name: 'Communications', icon: '', color: '#aa00ff' },
  { name: 'Life Support', icon: '', color: '#88ff00' }
];

function initSubAgents() {
  const container = document.getElementById('sub-agents-container');
  const centerX = window.innerWidth / 2;
  const centerY = window.innerHeight / 2;
  const radius = 320;

  subAgents.forEach((agent, i) => {
    const angle = (i / subAgents.length) * Math.PI * 2 - Math.PI / 2;
    const x = centerX + Math.cos(angle) * radius - 35;
    const y = centerY + Math.sin(angle) * radius - 35;

    const div = document.createElement('div');
    div.className = 'sub-agent';
    div.style.left = x + 'px';
    div.style.top = y + 'px';
    div.style.borderColor = agent.color;
    div.innerHTML = `
      <div class="sub-agent-icon" style="color: ${agent.color};">${agent.icon}</div>
      <div class="sub-agent-label">${agent.name}</div>
    `;
    container.appendChild(div);
  });
}

function initConnectors() {
  const svg = document.getElementById('connectors-svg');
  const centerX = window.innerWidth / 2;
  const centerY = window.innerHeight / 2;
  const radius = 320;

  subAgents.forEach((agent, i) => {
    const angle = (i / subAgents.length) * Math.PI * 2 - Math.PI / 2;
    const x = centerX + Math.cos(angle) * radius;
    const y = centerY + Math.sin(angle) * radius;

    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    line.setAttribute('x1', centerX);
    line.setAttribute('y1', centerY);
    line.setAttribute('x2', x);
    line.setAttribute('y2', y);
    line.setAttribute('class', 'connector-line');
    line.setAttribute('stroke', agent.color);
    svg.appendChild(line);
  });
}

// ============ FILE UPLOAD ============
let uploadedFiles = [];

function initFileUpload() {
  const zone = document.getElementById('fileUploadZone');
  
  zone.addEventListener('dragover', (e) => {
    e.preventDefault();
    zone.classList.add('dragover');
  });
  
  zone.addEventListener('dragleave', () => {
    zone.classList.remove('dragover');
  });
  
  zone.addEventListener('drop', (e) => {
    e.preventDefault();
    zone.classList.remove('dragover');
    handleFiles(e.dataTransfer.files);
  });
}

function handleFiles(files) {
  Array.from(files).forEach(file => {
    const reader = new FileReader();
    reader.onload = (e) => {
      uploadedFiles.push({
        name: file.name,
        size: (file.size / 1024).toFixed(2) + ' KB',
        type: file.type,
        content: e.target.result
      });
      renderFileList();
      playSuccess();
      addAgentMessage(` File uploaded: ${file.name} (${(file.size / 1024).toFixed(2)} KB)`);
    };
    reader.readAsText(file);
  });
}

function renderFileList() {
  const list = document.getElementById('fileList');
  list.innerHTML = uploadedFiles.map((file, i) => `
    <div class="file-item">
      <div class="file-icon">📄</div>
      <div class="file-info">
        <div class="file-name">${file.name}</div>
        <div class="file-size">${file.size}</div>
      </div>
      <button class="file-delete" onclick="deleteFile(${i})">✕</button>
    </div>
  `).join('');
}

function deleteFile(index) {
  uploadedFiles.splice(index, 1);
  renderFileList();
  playClick();
}

// ============ WORKFLOW BUILDER ============
let workflowNodes = [];
let workflowConnections = [];
let nodeIdCounter = 0;
let selectedNode = null;
let connectingFrom = null;

function toggleWorkflow() {
  playClick();
  document.getElementById('workflowPanel').classList.toggle('open');
}

function addNode(type) {
  const canvas = document.getElementById('workflowCanvas');
  const node = document.createElement('div');
  node.className = 'workflow-node';
  node.id = `node-${nodeIdCounter}`;
  node.style.left = (100 + Math.random() * 400) + 'px';
  node.style.top = (100 + Math.random() * 300) + 'px';
  
  const nodeTypes = {
    trigger: { icon: '', title: 'TRIGGER', color: '#ff006e', desc: 'Start workflow' },
    action: { icon: '🔧', title: 'ACTION', color: '#00d4ff', desc: 'Perform action' },
    llm: { icon: '🤖', title: 'LLM', color: '#7b2cbf', desc: 'AI Processing' }
  };
  
  const config = nodeTypes[type];
  
  node.innerHTML = `
    <div class="node-header">
      <div class="node-icon" style="background: ${config.color}">${config.icon}</div>
      <div class="node-title">${config.title} ${nodeIdCounter + 1}</div>
    </div>
    <div class="node-content">${config.desc}</div>
    <div class="node-ports">
      <div class="node-port input" onclick="handlePortClick(event, ${nodeIdCounter}, 'input')"></div>
      <div class="node-port output" onclick="handlePortClick(event, ${nodeIdCounter}, 'output')"></div>
    </div>
  `;
  
  makeDraggable(node);
  canvas.appendChild(node);
  workflowNodes.push({ id: nodeIdCounter, type: type, element: node });
  nodeIdCounter++;
  playClick();
}

function makeDraggable(element) {
  let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
  
  element.onmousedown = dragMouseDown;
  
  function dragMouseDown(e) {
    e = e || window.event;
    e.preventDefault();
    pos3 = e.clientX;
    pos4 = e.clientY;
    document.onmouseup = closeDragElement;
    document.onmousemove = elementDrag;
  }
  
  function elementDrag(e) {
    e = e || window.event;
    e.preventDefault();
    pos1 = pos3 - e.clientX;
    pos2 = pos4 - e.clientY;
    pos3 = e.clientX;
    pos4 = e.clientY;
    element.style.top = (element.offsetTop - pos2) + "px";
    element.style.left = (element.offsetLeft - pos1) + "px";
    updateConnections();
  }
  
  function closeDragElement() {
    document.onmouseup = null;
    document.onmousemove = null;
  }
}

function handlePortClick(event, nodeId, portType) {
  event.stopPropagation();
  
  if (!connectingFrom) {
    connectingFrom = { nodeId, portType };
    event.target.style.transform = 'scale(2)';
    event.target.style.boxShadow = '0 0 20px #00d4ff';
  } else {
    if (connectingFrom.nodeId !== nodeId && connectingFrom.portType !== portType) {
      workflowConnections.push({
        from: connectingFrom.nodeId,
        to: nodeId
      });
      updateConnections();
      playSuccess();
    }
    connectingFrom = null;
    document.querySelectorAll('.node-port').forEach(p => {
      p.style.transform = 'scale(1)';
      p.style.boxShadow = 'none';
    });
  }
}

function updateConnections() {
  const svg = document.getElementById('workflowConnections');
  svg.innerHTML = '';
  
  workflowConnections.forEach(conn => {
    const fromNode = document.getElementById(`node-${conn.from}`);
    const toNode = document.getElementById(`node-${conn.to}`);
    
    if (fromNode && toNode) {
      const fromRect = fromNode.getBoundingClientRect();
      const toRect = toNode.getBoundingClientRect();
      const canvasRect = svg.getBoundingClientRect();
      
      const x1 = fromRect.right - canvasRect.left;
      const y1 = fromRect.top + fromRect.height / 2 - canvasRect.top;
      const x2 = toRect.left - canvasRect.left;
      const y2 = toRect.top + toRect.height / 2 - canvasRect.top;
      
      const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      const midX = (x1 + x2) / 2;
      const d = `M ${x1} ${y1} C ${midX} ${y1}, ${midX} ${y2}, ${x2} ${y2}`;
      
      path.setAttribute('d', d);
      path.setAttribute('class', 'connection-line');
      svg.appendChild(path);
    }
  });
}

function runWorkflow() {
  playSuccess();
  addAgentMessage("🔄 **Workflow Executing...**\n\nProcessing nodes in sequence:\n" + 
    workflowNodes.map((n, i) => `  ${i + 1}. ${n.type.toUpperCase()} Node ${n.id + 1}`).join('\n') +
    "\n\n✅ Workflow completed successfully!");
}

// ============ INTEGRATIONS ============
const integrations = [
  { name: 'OpenAI', icon: '🤖', status: 'connected' },
  { name: 'Google Drive', icon: '📁', status: 'disconnected' },
  { name: 'Slack', icon: '💬', status: 'disconnected' },
  { name: 'GitHub', icon: '🐙', status: 'connected' },
  { name: 'Database', icon: '🗄️', status: 'disconnected' },
  { name: 'Webhook', icon: '🔗', status: 'disconnected' }
];

function initIntegrations() {
  const grid = document.getElementById('integrationGrid');
  grid.innerHTML = integrations.map(int => `
    <div class="integration-card ${int.status}" onclick="toggleIntegrationStatus(this, '${int.name}')">
      <div class="integration-icon">${int.icon}</div>
      <div class="integration-name">${int.name}</div>
      <div class="integration-status">${int.status === 'connected' ? '✓ Connected' : '○ Disconnected'}</div>
    </div>
  `).join('');
}

function toggleIntegrationStatus(element, name) {
  playClick();
  element.classList.toggle('connected');
  const status = element.classList.contains('connected') ? '✓ Connected' : '○ Disconnected';
  element.querySelector('.integration-status').textContent = status;
  addAgentMessage(`🔗 ${name} ${status === '✓ Connected' ? 'connected' : 'disconnected'}`);
}

function toggleIntegration() {
  playClick();
  document.getElementById('integrationPanel').classList.toggle('open');
}

// ============ SETTINGS ============
function toggleSettings() {
  playClick();
  document.getElementById('settingsPanel').classList.toggle('open');
}

function openSettings() {
  toggleSettings();
}

// ============ CHAT ============
function handleChatKey(e) {
  if (e.key === 'Enter') sendMessage();
}

async function sendMessage() {
  const input = document.getElementById('chatInput');
  const msg = input.value.trim();
  if (!msg) return;

  addUserMessage(msg);
  input.value = '';
  playClick();

  // Process with AI
  const response = await callAI(msg);
  addAgentMessage(response);
  playSuccess();
}

async function callAI(userMessage) {
  const apiKey = document.getElementById('apiKey').value;
  const model = document.getElementById('aiModel').value;
  const systemPrompt = document.getElementById('systemPrompt').value;

  if (!apiKey) {
    return "⚠️ Please configure your API key in settings.";
  }

  try {
    const response = await fetch('https://api.openai.com/v1/chat/completions', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${apiKey}`
      },
      body: JSON.stringify({
        model: model,
        messages: [
          { role: 'system', content: systemPrompt },
          { role: 'user', content: userMessage }
        ],
        temperature: 0.7,
        max_tokens: 500
      })
    });

    const data = await response.json();
    return data.choices[0].message.content;
  } catch (error) {
    return `❌ Error: ${error.message}`;
  }
}

function addUserMessage(msg) {
  const container = document.getElementById('chatMessages');
  const div = document.createElement('div');
  div.className = 'chat-message user';
  div.textContent = msg;
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
}

function addAgentMessage(msg) {
  const container = document.getElementById('chatMessages');
  const div = document.createElement('div');
  div.className = 'chat-message agent';
  div.innerHTML = msg.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/\n/g, '<br>');
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
}

// ============ RESIZE ============
window.addEventListener('resize', () => {
  if (canvas.width) {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
});
</script>
